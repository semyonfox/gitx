[package]
name = "gitx"
version = "0.3.0-rc.1"
edition = "2024"
rust-version = "1.88"
description = "A safer NPX-style runner for Git repositories and package tools."
license = "MIT"
readme = "README.md"
repository = "https://github.com/semyonfox/gitx"
homepage = "https://github.com/semyonfox/gitx"
keywords = ["cli", "git", "npm", "runner", "security"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.9"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
toml = "1.1.4"
urlencoding = "2.1.3"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
